name: generate-profile-cards

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout github-readme-stats app
        uses: actions/checkout@v4
        with:
          repository: anuraghazra/github-readme-stats
          path: stats-app

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install stats app dependencies
        working-directory: stats-app
        run: npm ci

      - name: Generate stats cards
        working-directory: stats-app
        env:
          PAT_1: ${{ secrets.PAT_1 }}
          PORT: "3000"
        run: |
          node express.js &
          sleep 12
          mkdir -p ../dist
          curl -sS "http://localhost:3000/api?username=ImWuMie&show_icons=true&rank_icon=github&theme=radical&border_radius=16&hide_border=true" -o ../dist/github-stats.svg
          curl -sS "http://localhost:3000/api/top-langs/?username=ImWuMie&layout=donut&theme=radical&border_radius=16&langs_count=8&hide_border=true" -o ../dist/top-langs.svg
          kill %1 || true

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ImWuMie
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=ff6ec4&color_dots=#151515,#7f4ca5,#5a9ad6,#9bc8e8,#f0d9b5

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=ImWuMie&theme=radical&hide_border=true&border_radius=16
          path: dist/streak.svg
          token: ${{ secrets.PAT_1 }}

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
