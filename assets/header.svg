<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="wumie — reverse engineer, bytecode explorer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0f6"><animate attributeName="stop-color" values="#fff0f6;#f6f0ff;#fff0f6" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#f2eeff"><animate attributeName="stop-color" values="#f2eeff;#eaf6ff;#f2eeff" dur="12s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#e9f7ff"><animate attributeName="stop-color" values="#e9f7ff;#f2eeff;#e9f7ff" dur="12s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5fa2"><animate attributeName="stop-color" values="#ff5fa2;#a55eff;#3ec6ff;#ffd23f;#ff5fa2" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#3ec6ff"><animate attributeName="stop-color" values="#3ec6ff;#ffd23f;#ff5fa2;#a55eff;#3ec6ff" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffb3d1" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffb3d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#b3e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b3e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd9a8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a55eff"/>
      <stop offset="100%" stop-color="#3ec6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="tshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#ff5fa2" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- soft pastel blobs -->
  <circle cx="170" cy="60" r="180" fill="url(#blobA)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="240" r="200" fill="url(#blobB)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="280" r="140" fill="url(#blobC)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- floating confetti -->
  <g>
    <circle cx="70"  cy="310" r="3.2" fill="#ff5fa2" opacity="0"><animate attributeName="cy" values="310;-10" dur="11s" repeatCount="indefinite" begin="0s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="11s" repeatCount="indefinite" begin="0s"/></circle>
    <circle cx="150" cy="310" r="2.2" fill="#ffd23f" opacity="0"><animate attributeName="cy" values="310;-10" dur="15s" repeatCount="indefinite" begin="1.4s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="15s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="240" cy="310" r="3.0" fill="#3ec6ff" opacity="0"><animate attributeName="cy" values="310;-10" dur="13s" repeatCount="indefinite" begin="2.6s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="13s" repeatCount="indefinite" begin="2.6s"/></circle>
    <circle cx="330" cy="310" r="2.0" fill="#a55eff" opacity="0"><animate attributeName="cy" values="310;-10" dur="16s" repeatCount="indefinite" begin="0.9s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="16s" repeatCount="indefinite" begin="0.9s"/></circle>
    <circle cx="410" cy="310" r="2.6" fill="#6effa1" opacity="0"><animate attributeName="cy" values="310;-10" dur="12s" repeatCount="indefinite" begin="3.2s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="12s" repeatCount="indefinite" begin="3.2s"/></circle>
    <circle cx="500" cy="310" r="3.4" fill="#ff8a5c" opacity="0"><animate attributeName="cy" values="310;-10" dur="14s" repeatCount="indefinite" begin="1.1s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="14s" repeatCount="indefinite" begin="1.1s"/></circle>
    <circle cx="590" cy="310" r="2.2" fill="#ff5fa2" opacity="0"><animate attributeName="cy" values="310;-10" dur="17s" repeatCount="indefinite" begin="0.4s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="17s" repeatCount="indefinite" begin="0.4s"/></circle>
    <circle cx="680" cy="310" r="2.8" fill="#ffd23f" opacity="0"><animate attributeName="cy" values="310;-10" dur="12s" repeatCount="indefinite" begin="4.0s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="12s" repeatCount="indefinite" begin="4.0s"/></circle>
    <circle cx="760" cy="310" r="2.0" fill="#3ec6ff" opacity="0"><animate attributeName="cy" values="310;-10" dur="15s" repeatCount="indefinite" begin="2.0s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="15s" repeatCount="indefinite" begin="2.0s"/></circle>
    <circle cx="850" cy="310" r="3.0" fill="#a55eff" opacity="0"><animate attributeName="cy" values="310;-10" dur="13s" repeatCount="indefinite" begin="0.7s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="13s" repeatCount="indefinite" begin="0.7s"/></circle>
    <circle cx="930" cy="310" r="2.4" fill="#6effa1" opacity="0"><animate attributeName="cy" values="310;-10" dur="16s" repeatCount="indefinite" begin="2.9s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="16s" repeatCount="indefinite" begin="2.9s"/></circle>
    <circle cx="45"  cy="310" r="2.0" fill="#ff8a5c" opacity="0"><animate attributeName="cy" values="310;-10" dur="18s" repeatCount="indefinite" begin="5.0s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="18s" repeatCount="indefinite" begin="5.0s"/></circle>
    <circle cx="480" cy="310" r="2.6" fill="#ff5fa2" opacity="0"><animate attributeName="cy" values="310;-10" dur="14s" repeatCount="indefinite" begin="1.7s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="14s" repeatCount="indefinite" begin="1.7s"/></circle>
    <circle cx="720" cy="310" r="2.0" fill="#ffd23f" opacity="0"><animate attributeName="cy" values="310;-10" dur="11s" repeatCount="indefinite" begin="3.6s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="11s" repeatCount="indefinite" begin="3.6s"/></circle>
    <circle cx="970" cy="310" r="2.8" fill="#3ec6ff" opacity="0"><animate attributeName="cy" values="310;-10" dur="13s" repeatCount="indefinite" begin="0.2s"/><animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.15;0.85;1" dur="13s" repeatCount="indefinite" begin="0.2s"/></circle>
  </g>

  <!-- main title -->
  <text x="500" y="168" font-family="'Segoe UI', 'Poppins', Arial, sans-serif" font-size="88" font-weight="900" text-anchor="middle" fill="url(#title)" letter-spacing="3" filter="url(#tshadow)">wumie</text>

  <!-- subtitle -->
  <text x="500" y="222" font-family="Consolas, 'Courier New', monospace" font-size="20" text-anchor="middle" fill="#6a5b8e" letter-spacing="4">REVERSE ENGINEER · MODDER</text>

  <!-- pulsing accent line -->
  <line x1="250" y1="246" x2="750" y2="246" stroke="url(#line)" stroke-width="2" stroke-linecap="round" opacity="0.5">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>
